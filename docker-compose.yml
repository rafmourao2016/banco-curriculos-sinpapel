version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sinpapel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sinpapel
      POSTGRES_PASSWORD: sinpapel
      POSTGRES_DB: sinpapel
    ports:
      - "5432:5432"
    volumes:
      - sinpapel_pg_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: sinpapel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  sinpapel_pg_data:
